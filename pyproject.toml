[project]
name = "praxis-ai"
version = "0.1.0"
description = "Praxis AI: Autonomous Enterprise Operations & SOP-Grounded Agent Platform"
readme = "README.md"
authors = [
    { name = "Dhanvith Nayak", email = "dhanvithnayak@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.8.0",
    "lancedb>=0.37.1",
    "litellm>=1.97.0",
    "prompt-toolkit>=3.0.53",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.scripts]
praxis = "praxis_ai:main"
praxis-ai = "praxis_ai:main"
claude-code-clone = "praxis_ai:main"
agent-cli = "praxis_ai:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E741"]

